<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>あたり・はずれルーレット</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Segoe UI", "Hiragino Sans", "Yu Gothic UI", sans-serif;
    background: radial-gradient(circle at 50% 30%, #2a1050, #0b0420 70%);
    color: #f8fafc;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px;
    overflow-x: hidden;
  }
  h1 {
    margin: 0 0 12px;
    letter-spacing: 0.15em;
    background: linear-gradient(90deg, #facc15, #f43f5e, #a855f7);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .stats {
    display: flex; gap: 20px; margin-bottom: 16px;
    font-size: 0.95rem; color: #cbd5e1;
  }
  .stats b { color: #facc15; font-size: 1.2rem; }
  .container {
    display: flex; gap: 32px; flex-wrap: wrap;
    justify-content: center; align-items: flex-start;
  }
  .wheel-area { position: relative; width: 440px; max-width: 90vw; }
  .wheel-wrap { position: relative; border-radius: 50%; transition: box-shadow 0.3s; }
  .wheel-wrap.hot { animation: hotGlow 0.5s linear infinite; }
  @keyframes hotGlow {
    0%   { box-shadow: 0 0 40px 10px #f43f5e; }
    33%  { box-shadow: 0 0 60px 16px #facc15; }
    66%  { box-shadow: 0 0 40px 10px #22d3ee; }
    100% { box-shadow: 0 0 40px 10px #f43f5e; }
  }
  canvas#wheel { width: 100%; height: auto; display: block; }
  .pointer {
    position: absolute; top: -8px; left: 50%; transform: translateX(-50%);
    width: 0; height: 0;
    border-left: 20px solid transparent; border-right: 20px solid transparent;
    border-top: 40px solid #facc15;
    filter: drop-shadow(0 2px 4px rgba(0,0,0,0.6));
    z-index: 2;
  }
  .spin-btn {
    margin-top: 20px; width: 100%; padding: 16px;
    font-size: 1.4rem; font-weight: bold; letter-spacing: 0.1em;
    border: none; border-radius: 14px;
    background: linear-gradient(180deg, #fb7185, #e11d48);
    color: white; cursor: pointer;
    box-shadow: 0 6px 0 #9f1239;
    transition: transform 0.08s, box-shadow 0.08s;
  }
  .spin-btn:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 2px 0 #9f1239; }
  .spin-btn:disabled { background: #475569; box-shadow: 0 6px 0 #334155; cursor: not-allowed; }
  .result {
    margin-top: 16px; min-height: 2.6em;
    text-align: center; font-size: 1.8rem; font-weight: bold;
  }
  .result.reach { color: #f43f5e; animation: blink 0.25s steps(2) infinite; }
  .result.lose  { color: #94a3b8; animation: drop 0.6s ease-out; }
  .result.win   { color: #facc15; }
  @keyframes blink { 50% { opacity: 0.2; } }
  @keyframes drop { from { transform: translateY(-20px); opacity: 0; } to { transform: none; opacity: 1; } }

  .premonition {
    position: absolute; left: 50%; top: 50%;
    transform: translate(-50%, -50%) rotate(-8deg);
    font-size: 3.2rem; font-weight: 900; white-space: nowrap;
    color: #fff;
    -webkit-text-stroke: 2px #b91c1c;
    text-shadow: 0 0 10px #f43f5e, 0 0 30px #facc15;
    pointer-events: none; z-index: 3;
    display: none;
    animation: premo 0.3s ease-in-out infinite alternate;
  }
  .premonition.show { display: block; }
  @keyframes premo {
    from { transform: translate(-50%, -50%) rotate(-8deg) scale(1); }
    to   { transform: translate(-50%, -50%) rotate(-8deg) scale(1.15); }
  }

  .panel {
    background: rgba(255,255,255,0.07);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 16px; padding: 20px;
    width: 320px; max-width: 90vw;
  }
  .panel h2 { margin: 0 0 12px; font-size: 1.05rem; }
  .row { margin-bottom: 16px; }
  .row label { display: flex; justify-content: space-between; margin-bottom: 6px; }
  input[type=range] { width: 100%; }
  .check { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .history { font-size: 0.9rem; color: #cbd5e1; }
  .history ol { margin: 6px 0 0; padding-left: 0; list-style: none;
    max-height: 200px; overflow-y: auto; display: flex; flex-wrap: wrap; gap: 6px; }
  .history li { padding: 4px 10px; border-radius: 999px; font-weight: bold; font-size: 0.85rem; }
  .history li.w { background: #facc15; color: #7c2d12; }
  .history li.l { background: #334155; color: #94a3b8; }

  /* ===== 大当たり演出 ===== */
  #fx { position: fixed; inset: 0; pointer-events: none; z-index: 50; }
  .flash {
    position: fixed; inset: 0; background: #fff; z-index: 60;
    pointer-events: none; opacity: 0;
  }
  .flash.on { animation: flash 0.9s ease-out; }
  @keyframes flash {
    0% { opacity: 1; } 10% { opacity: 0.2; } 20% { opacity: 1; }
    30% { opacity: 0.3; } 40% { opacity: 0.9; } 100% { opacity: 0; }
  }
  body.shake { animation: shake 0.6s; }
  @keyframes shake {
    0%,100% { transform: none; }
    10% { transform: translate(-14px, 8px) rotate(-1deg); }
    20% { transform: translate(12px, -10px) rotate(1deg); }
    30% { transform: translate(-10px, 6px); }
    40% { transform: translate(10px, -4px) rotate(1deg); }
    50% { transform: translate(-6px, 4px); }
    70% { transform: translate(4px, -2px); }
  }

  .bonus {
    position: fixed; inset: 0; z-index: 40;
    display: none; align-items: center; justify-content: center;
    flex-direction: column; overflow: hidden; cursor: pointer;
    background: rgba(0,0,0,0.75);
  }
  .bonus.show { display: flex; }
  .rays {
    position: absolute; width: 250vmax; height: 250vmax;
    left: 50%; top: 50%; margin: -125vmax 0 0 -125vmax;
    background: repeating-conic-gradient(
      rgba(250,204,21,0.55) 0deg 7deg, rgba(244,63,94,0.15) 7deg 15deg,
      rgba(34,211,238,0.45) 15deg 22deg, rgba(168,85,247,0.15) 22deg 30deg);
    animation: spinRays 4s linear infinite, hue 1s linear infinite;
  }
  @keyframes spinRays { to { transform: rotate(360deg); } }
  @keyframes hue { to { filter: hue-rotate(360deg); } }
  .bonus-title {
    position: relative;
    font-size: min(18vw, 11rem); font-weight: 900; line-height: 1;
    letter-spacing: 0.05em; white-space: nowrap;
    background: linear-gradient(90deg, #ff0040, #ff8a00, #ffe600, #00ff6a, #00e5ff, #8a00ff, #ff00c8, #ff0040);
    background-size: 200% 100%;
    -webkit-background-clip: text; background-clip: text; color: transparent;
    -webkit-text-stroke: 3px #fff;
    filter: drop-shadow(0 0 20px #fff) drop-shadow(0 0 40px #facc15);
    animation: slam 0.7s cubic-bezier(.2,1.6,.4,1) both, rainbow 0.6s linear infinite;
  }
  @keyframes slam {
    0% { transform: scale(6) rotate(-20deg); opacity: 0; }
    60% { transform: scale(0.9) rotate(3deg); opacity: 1; }
    100% { transform: scale(1) rotate(0); }
  }
  @keyframes rainbow { to { background-position: 200% 0; } }
  .bonus-sub {
    position: relative; margin-top: 18px;
    font-size: min(7vw, 3.2rem); font-weight: 900; color: #fff;
    text-shadow: 0 0 10px #f43f5e, 0 0 20px #f43f5e, 0 4px 0 #9f1239;
    animation: pulse 0.35s ease-in-out infinite alternate, fadeIn 0.4s 0.5s both;
  }
  @keyframes pulse { to { transform: scale(1.12); } }
  @keyframes fadeIn { from { opacity: 0; } }
  .bonus-count {
    position: relative; margin-top: 14px;
    font-size: min(6vw, 2.6rem); font-weight: bold; color: #facc15;
    font-variant-numeric: tabular-nums;
    text-shadow: 0 0 12px #facc15;
    animation: fadeIn 0.4s 0.8s both;
  }
  .bonus-hint { position: relative; margin-top: 30px; color: #e2e8f0; opacity: 0.7; font-size: 0.9rem;
    animation: fadeIn 0.4s 2s both; }
</style>
</head>
<body>
  <h1>🎰 あたり・はずれルーレット</h1>
  <div class="stats">
    <div>回転数 <b id="statSpins">0</b></div>
    <div>大当たり <b id="statWins">0</b></div>
    <div>連チャン <b id="statCombo">0</b></div>
  </div>

  <div class="container">
    <div class="wheel-area">
      <div class="pointer"></div>
      <div class="wheel-wrap" id="wheelWrap">
        <canvas id="wheel" width="880" height="880"></canvas>
      </div>
      <div class="premonition" id="premo">激アツ!!</div>
      <button class="spin-btn" id="spinBtn">回す！（Space）</button>
      <div class="result" id="result"></div>
    </div>

    <div class="panel">
      <h2>設定</h2>
      <div class="row">
        <label><span>あたりの数</span><span id="hitLabel"></span></label>
        <input type="range" id="hitRange" min="1" max="8" value="3">
      </div>
      <div class="check"><input type="checkbox" id="soundOn" checked><label for="soundOn">サウンド ON</label></div>
      <div class="check"><input type="checkbox" id="premoOn" checked><label for="premoOn">予告演出（激アツ）</label></div>
      <div class="history">
        履歴
        <ol id="historyList"></ol>
      </div>
    </div>
  </div>

  <div class="bonus" id="bonus">
    <div class="rays"></div>
    <div class="bonus-title">大当たり</div>
    <div class="bonus-sub" id="bonusSub">BONUS GET!!</div>
    <div class="bonus-count" id="bonusCount">+0 玉</div>
    <div class="bonus-hint">クリックで閉じる</div>
  </div>
  <canvas id="fx"></canvas>
  <div class="flash" id="flash"></div>

<script>
  const SEG = 16;
  const TAU = Math.PI * 2;

  const canvas = document.getElementById("wheel");
  const ctx = canvas.getContext("2d");
  const wheelWrap = document.getElementById("wheelWrap");
  const spinBtn = document.getElementById("spinBtn");
  const resultEl = document.getElementById("result");
  const premoEl = document.getElementById("premo");
  const hitRange = document.getElementById("hitRange");
  const hitLabel = document.getElementById("hitLabel");
  const soundOn = document.getElementById("soundOn");
  const premoOn = document.getElementById("premoOn");
  const historyList = document.getElementById("historyList");
  const bonusEl = document.getElementById("bonus");
  const bonusSub = document.getElementById("bonusSub");
  const bonusCount = document.getElementById("bonusCount");
  const flashEl = document.getElementById("flash");

  let hits = Number(localStorage.getItem("roulette-hits")) || 3;
  hitRange.value = hits;
  let segments = [];
  let angle = 0;
  let spinning = false;
  let stats = { spins: 0, wins: 0, combo: 0 };

  function buildSegments() {
    segments = Array(SEG).fill(false);
    for (let k = 0; k < hits; k++) segments[Math.floor(k * SEG / hits)] = true;
    hitLabel.textContent = `${hits} / ${SEG}（${Math.round(hits / SEG * 100)}%）`;
  }

  function drawWheel() {
    const size = canvas.width, c = size / 2, r = c - 12;
    const slice = TAU / SEG;
    ctx.clearRect(0, 0, size, size);

    // 外枠
    ctx.beginPath(); ctx.arc(c, c, r + 8, 0, TAU);
    ctx.fillStyle = "#facc15"; ctx.fill();

    for (let i = 0; i < SEG; i++) {
      const start = angle + i * slice - Math.PI / 2;
      const win = segments[i];
      ctx.beginPath();
      ctx.moveTo(c, c);
      ctx.arc(c, c, r, start, start + slice);
      ctx.closePath();
      if (win) {
        const g = ctx.createRadialGradient(c, c, 60, c, c, r);
        g.addColorStop(0, "#fde047"); g.addColorStop(1, "#ef4444");
        ctx.fillStyle = g;
      } else {
        ctx.fillStyle = i % 2 ? "#1e293b" : "#334155";
      }
      ctx.fill();
      ctx.strokeStyle = "#0f172a"; ctx.lineWidth = 3; ctx.stroke();

      ctx.save();
      ctx.translate(c, c);
      ctx.rotate(start + slice / 2);
      ctx.textAlign = "right"; ctx.textBaseline = "middle";
      ctx.font = win ? "900 40px sans-serif" : "bold 32px sans-serif";
      ctx.fillStyle = win ? "#fff" : "#94a3b8";
      if (win) { ctx.shadowColor = "#b91c1c"; ctx.shadowBlur = 8; }
      ctx.fillText(win ? "あたり" : "はずれ", r - 28, 0);
      ctx.restore();
    }

    // ランプ
    for (let i = 0; i < SEG * 2; i++) {
      const a = i * TAU / (SEG * 2);
      ctx.beginPath();
      ctx.arc(c + Math.cos(a) * (r + 2), c + Math.sin(a) * (r + 2), 6, 0, TAU);
      ctx.fillStyle = (i + Math.floor(performance.now() / 120)) % 2 ? "#fff" : "#f97316";
      ctx.fill();
    }

    ctx.beginPath(); ctx.arc(c, c, 70, 0, TAU);
    ctx.fillStyle = "#0b0420"; ctx.fill();
    ctx.lineWidth = 8; ctx.strokeStyle = "#facc15"; ctx.stroke();
    ctx.fillStyle = "#facc15"; ctx.font = "900 34px sans-serif";
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText("SPIN", c, c);
  }

  function indexAt(a) {
    const n = ((-a) % TAU + TAU) % TAU;
    return Math.floor(n / (TAU / SEG)) % SEG;
  }

  // ===== サウンド（Web Audio） =====
  let audio = null;
  function ac() {
    if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)();
    if (audio.state === "suspended") audio.resume();
    return audio;
  }
  function tone(freq, start, dur, type = "square", vol = 0.12, endFreq = null) {
    if (!soundOn.checked) return;
    const a = ac(), t = a.currentTime + start;
    const o = a.createOscillator(), g = a.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t);
    if (endFreq) o.frequency.exponentialRampToValueAtTime(endFreq, t + dur);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(a.destination);
    o.start(t); o.stop(t + dur + 0.02);
  }
  const tick = (pitch = 1) => tone(1200 * pitch, 0, 0.03, "square", 0.05);
  function kyuin() {
    // キュイーン！
    tone(300, 0, 0.7, "sawtooth", 0.15, 3200);
    tone(450, 0, 0.7, "square", 0.08, 4200);
    tone(3200, 0.7, 0.5, "sine", 0.12, 2800);
  }
  function fanfare() {
    const n = { C5: 523, E5: 659, G5: 784, C6: 1047, D6: 1175, E6: 1319, G6: 1568, A5: 880, F5: 698 };
    const seq = [
      ["C5", 0, 0.12], ["E5", 0.12, 0.12], ["G5", 0.24, 0.12], ["C6", 0.36, 0.25],
      ["G5", 0.62, 0.12], ["C6", 0.74, 0.5],
      ["A5", 1.3, 0.12], ["C6", 1.42, 0.12], ["D6", 1.54, 0.12], ["E6", 1.66, 0.25],
      ["D6", 1.92, 0.12], ["E6", 2.04, 0.12], ["G6", 2.16, 1.0],
    ];
    seq.forEach(([k, s, d]) => { tone(n[k], 1.0 + s, d + 0.05, "square", 0.09); tone(n[k] / 2, 1.0 + s, d + 0.05, "triangle", 0.12); });
    [523, 659, 784, 1047].forEach(f => tone(f, 3.2, 1.6, "sawtooth", 0.04));
  }
  function reachSound() { tone(880, 0, 0.12, "square", 0.07); tone(880, 0.16, 0.12, "square", 0.07); }
  function premoSound() { tone(200, 0, 0.5, "sawtooth", 0.12, 1600); tone(1600, 0.5, 0.3, "square", 0.08); }
  function loseSound() { tone(392, 0, 0.25, "triangle", 0.15); tone(330, 0.25, 0.25, "triangle", 0.15); tone(262, 0.5, 0.6, "triangle", 0.15, 180); }
  function coinSound(i) { tone(1800 + (i % 5) * 200, 0, 0.08, "square", 0.04); }

  // ===== パーティクル =====
  const fx = document.getElementById("fx");
  const fctx = fx.getContext("2d");
  let particles = [];
  let fxRunning = false;
  function resizeFx() { fx.width = innerWidth; fx.height = innerHeight; }
  addEventListener("resize", resizeFx); resizeFx();

  const CONFETTI = ["#ff0040", "#ff8a00", "#ffe600", "#00ff6a", "#00e5ff", "#8a00ff", "#ff00c8", "#ffffff"];
  function burst(x, y, count, spread, power) {
    for (let i = 0; i < count; i++) {
      const a = -Math.PI / 2 + (Math.random() - 0.5) * spread;
      const v = power * (0.5 + Math.random() * 0.7);
      particles.push({
        x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v,
        w: 6 + Math.random() * 8, h: 4 + Math.random() * 6,
        rot: Math.random() * TAU, vr: (Math.random() - 0.5) * 0.4,
        color: CONFETTI[(Math.random() * CONFETTI.length) | 0],
        coin: Math.random() < 0.25, life: 1,
      });
    }
    if (!fxRunning) { fxRunning = true; requestAnimationFrame(fxLoop); }
  }
  function fxLoop() {
    fctx.clearRect(0, 0, fx.width, fx.height);
    particles.forEach(p => {
      p.vy += 0.25; p.vx *= 0.99; p.vy *= 0.99;
      p.x += p.vx; p.y += p.vy; p.rot += p.vr;
      fctx.save();
      fctx.translate(p.x, p.y); fctx.rotate(p.rot);
      if (p.coin) {
        fctx.scale(Math.abs(Math.cos(p.rot * 2)) + 0.1, 1);
        fctx.beginPath(); fctx.arc(0, 0, 9, 0, TAU);
        fctx.fillStyle = "#facc15"; fctx.fill();
        fctx.strokeStyle = "#b45309"; fctx.lineWidth = 2; fctx.stroke();
      } else {
        fctx.fillStyle = p.color;
        fctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      }
      fctx.restore();
    });
    particles = particles.filter(p => p.y < fx.height + 40);
    if (particles.length) requestAnimationFrame(fxLoop);
    else { fxRunning = false; fctx.clearRect(0, 0, fx.width, fx.height); }
  }

  // ===== 回転 =====
  function spin() {
    if (spinning) return;
    if (bonusEl.classList.contains("show")) closeBonus();
    spinning = true;
    spinBtn.disabled = true;
    resultEl.className = "result"; resultEl.textContent = "";

    const startAngle = angle;
    const extra = TAU * (6 + Math.random() * 3) + Math.random() * TAU;
    const finalAngle = startAngle + extra;
    const willWin = segments[indexAt(finalAngle)];
    // 予告：当たりなら70%、はずれでも12%（ガセ）で出現
    const showPremo = premoOn.checked && Math.random() < (willWin ? 0.7 : 0.12);
    const duration = showPremo ? 7000 : 5000 + Math.random() * 1000;
    const t0 = performance.now();
    let lastIdx = indexAt(angle), premoShown = false, reachShown = false;

    function frame(now) {
      const t = Math.min((now - t0) / duration, 1);
      const eased = 1 - Math.pow(1 - t, 4);
      angle = startAngle + extra * eased;
      drawWheel();

      const idx = indexAt(angle);
      if (idx !== lastIdx) { tick(segments[idx] ? 1.5 : 1); lastIdx = idx; }

      if (showPremo && !premoShown && t > 0.25) {
        premoShown = true;
        premoEl.classList.add("show");
        wheelWrap.classList.add("hot");
        premoSound();
      }
      if (!reachShown && t > 0.7) {
        reachShown = true;
        resultEl.className = "result reach";
        resultEl.textContent = "リーチ！！";
        reachSound();
      }

      if (t < 1) requestAnimationFrame(frame);
      else { angle %= TAU; finish(segments[indexAt(angle)]); }
    }
    requestAnimationFrame(frame);
  }

  function finish(win) {
    premoEl.classList.remove("show");
    wheelWrap.classList.remove("hot");
    stats.spins++;
    const li = document.createElement("li");
    if (win) {
      stats.wins++; stats.combo++;
      li.className = "w"; li.textContent = "当";
      resultEl.className = "result win";
      resultEl.textContent = "🎉 大当たり！！ 🎉";
      jackpot();
    } else {
      stats.combo = 0;
      li.className = "l"; li.textContent = "×";
      resultEl.className = "result lose";
      resultEl.textContent = "はずれ…";
      loseSound();
      spinning = false; spinBtn.disabled = false;
    }
    historyList.prepend(li);
    updateStats();
  }

  let bonusTimers = [];
  function jackpot() {
    kyuin();
    // フラッシュ＆揺れ
    flashEl.classList.remove("on"); void flashEl.offsetWidth; flashEl.classList.add("on");
    document.body.classList.remove("shake"); void document.body.offsetWidth; document.body.classList.add("shake");

    bonusTimers.push(setTimeout(() => {
      bonusSub.textContent = stats.combo > 1 ? `${stats.combo}連チャン!! 確変突入!!` : "BONUS GET!!";
      bonusEl.classList.add("show");
      // タイトル再アニメーション
      const title = bonusEl.querySelector(".bonus-title");
      title.style.animation = "none"; void title.offsetWidth; title.style.animation = "";
      fanfare();

      const W = innerWidth, H = innerHeight;
      burst(W * 0.1, H, 120, 0.8, 22);
      burst(W * 0.9, H, 120, 0.8, 22);
      burst(W * 0.5, H * 0.5, 150, TAU, 14);
      let n = 0;
      const rain = setInterval(() => {
        burst(Math.random() * W, -20, 12, 0.6, -2);
        if (n++ % 3 === 0) { burst(Math.random() < 0.5 ? 0 : W, H * 0.8, 40, 0.9, 20); }
      }, 150);
      bonusTimers.push(rain);

      // 玉カウントアップ
      const target = 1500 * stats.combo;
      const c0 = performance.now();
      let lastCoin = 0;
      const count = setInterval(() => {
        const p = Math.min((performance.now() - c0) / 3000, 1);
        bonusCount.textContent = `+${Math.floor(target * p).toLocaleString()} 玉`;
        if (p - lastCoin > 0.03) { coinSound(Math.floor(p * 100)); lastCoin = p; }
        if (p >= 1) clearInterval(count);
      }, 30);
      bonusTimers.push(count);

      bonusTimers.push(setTimeout(closeBonus, 7000));
    }, 600));
  }

  function closeBonus() {
    bonusTimers.forEach(id => { clearTimeout(id); clearInterval(id); });
    bonusTimers = [];
    bonusEl.classList.remove("show");
    document.body.classList.remove("shake");
    spinning = false; spinBtn.disabled = false;
  }

  function updateStats() {
    document.getElementById("statSpins").textContent = stats.spins;
    document.getElementById("statWins").textContent = stats.wins;
    document.getElementById("statCombo").textContent = stats.combo;
  }

  // ランプ点滅用のアイドル描画
  function idle() { if (!spinning) drawWheel(); requestAnimationFrame(idle); }

  hitRange.addEventListener("input", () => {
    if (spinning) { hitRange.value = hits; return; }
    hits = Number(hitRange.value);
    localStorage.setItem("roulette-hits", hits);
    buildSegments(); drawWheel();
  });
  spinBtn.onclick = spin;
  bonusEl.onclick = closeBonus;
  addEventListener("keydown", e => {
    if (e.code === "Space") {
      e.preventDefault();
      if (bonusEl.classList.contains("show")) closeBonus();
      else spin();
    }
  });

  buildSegments();
  idle();
</script>
</body>
</html>
